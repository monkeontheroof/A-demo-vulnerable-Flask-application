version: "3.8"
services:
  # Main app
  app:
    build: .
    env_file: ".env"
    links:
      - db
    ports:
      - "80:80"
    volumes:
      - ./website:/app/website
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal_network
  
  # DBMS
  db:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: password123
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - internal_network

# Internal network
networks:
  internal_network:
    driver: bridge